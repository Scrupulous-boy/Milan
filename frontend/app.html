(function(){
  "use strict";
  const markFilterRow = () => {
    const a = document.getElementById("filterAccess");
    const b = document.getElementById("filterType");
    if(!a && !b) return;

    const preferred = [
      ".filters",
      ".filter-bar",
      ".feed-toolbar",
      ".feedToolbar",
      ".toolbar",
      ".toolbar-row"
    ];

    let row = null;

    for(const sel of preferred){
      const base = (a || b).closest(sel);
      if(base && (!b || base.contains(b))){
        row = base;
        break;
      }
    }

    if(!row) row = a?.parentElement || b?.parentElement;
    if(row) row.classList.add("milan-sticky-filter-bar");
  };

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded",markFilterRow,{once:true});
  }else{
    markFilterRow();
  }
})();
</script>

<script id="milan-drawer-profile-js">
(function(){
  function q(sel){return document.querySelector(sel)}
  function g(id){return document.getElementById(id)}
  function txt(id,t){var el=g(id); if(el && el.textContent!==t) el.textContent=t}
  function shortDid(d){return d.length>28 ? d.slice(0,16)+"\u2026"+d.slice(-8) : d}
  function meObj(){try{return (typeof me!=="undefined" && me) ? me : null}catch(_){return null}}
  var lastKey="";
  function sync(){
    var box=g("mdpAvatar"); if(!box) return;
    var nEl=q("#myName"), eEl=q("#myEmail"), dEl=q("#myDid"), pEl=q("#privacyScore");
    var shown=nEl?nEl.textContent.trim():"";
    var email=eEl?eEl.textContent.trim():"";
    var did=dEl?dEl.textContent.trim():"";
    var m=meObj(), reg="";
    if(m){
      if(!email && m.email) email=String(m.email);
      if(!did && m.did) did=String(m.did);
      reg=String(m.name||(m.profile&&(m.profile.name||m.profile.display_name))||"").trim();
    }
    if(!reg) reg=shown;
    if(!reg && email) reg=email.split("@")[0];
    var letter=(Array.from(reg)[0]||"M").toUpperCase();
    if(m && m.name) shown=String(m.name).trim(); else if(!shown) shown=reg;
    var a=q(".leftRail .milan-avatar-upload .avatar");
    var im=a?a.querySelector("img"):null;
    var src=im?(im.getAttribute("src")||""):"";
    var key=src?("I:"+src):("L:"+letter);
    if(key!==lastKey){
      lastKey=key; box.textContent="";
      if(src){
        var img=document.createElement("img"); img.alt="Profile";
        img.onerror=function(){lastKey="L:"+letter; box.textContent=""; var b=document.createElement("b"); b.textContent=letter; box.appendChild(b);};
        img.src=src; box.appendChild(img);
      } else {
        var b=document.createElement("b"); b.textContent=letter; box.appendChild(b);
      }
    }
    txt("mdpName",shown);
    var dd=g("mdpDid"); if(dd){dd.setAttribute("data-full",did); dd.title=did?"Tap to copy":""; txt("mdpDid", did?shortDid(did):"\u2014");}
    var ee=g("mdpEmail"); if(ee){ee.title=email; txt("mdpEmail", email||"\u2014");}
    var pv=(pEl&&pEl.textContent.trim())||"100%";
    txt("mdpPrivacy",pv);
    var pn=parseInt(pv,10); var bar=g("mdpPrivBar"); if(bar) bar.style.width=(isNaN(pn)?100:Math.max(0,Math.min(100,pn)))+"%";
  }
  function legacyCopy(t){
    return new Promise(function(res,rej){
      try{
        var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
        ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length);
        var ok=document.execCommand("copy"); document.body.removeChild(ta);
        ok?res():rej(new Error("copy failed"));
      }catch(x){rej(x)}
    });
  }
  function copyText(t){
    if(navigator.clipboard && window.isSecureContext){return navigator.clipboard.writeText(t).catch(function(){return legacyCopy(t)})}
    return legacyCopy(t);
  }
  function doCopy(){
    var d=g("mdpDid"); var t=d?(d.getAttribute("data-full")||"").trim():""; if(!t) return;
    var btn=g("mdpCopy"), row=g("mdpDidRow");
    copyText(t).then(function(){
      if(btn){btn.textContent="Copied \u2713"; btn.classList.add("ok");}
      if(row) row.classList.add("flash");
      setTimeout(function(){if(btn){btn.textContent="Copy"; btn.classList.remove("ok");} if(row) row.classList.remove("flash");},1600);
      if(typeof toast==="function") toast("DID copied");
    }).catch(function(){
      if(typeof toast==="function") toast("Copy failed - press and hold the DID to copy");
    });
  }
  function start(){
    sync();
    var prof=q(".leftRail .profile");
    if(prof && window.MutationObserver){
      new MutationObserver(sync).observe(prof,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["src","style"]});
    }
    var ham=g("milanHamburger"); if(ham) ham.addEventListener("click",sync);
    var c=g("mdpCopy"); if(c) c.addEventListener("click",doCopy);
    var d=g("mdpDid"); if(d) d.addEventListener("click",doCopy);
    setInterval(sync,2500);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
  window.addEventListener("load",sync);
})();
</script>

<script>
(() => {
  let syncing = false;

  async function syncPersistentIdentity() {
    if (syncing) return;

    const token =
      localStorage.getItem("milan_token") ||
      localStorage.getItem("milan_token") ||
      "";

    if (!token) return;

    syncing = true;

    try {
      const headers = {
        Authorization: "Bearer " + token,
        Accept: "application/json",
        "Cache-Control": "no-cache"
      };

      const [profileResponse, meResponse] = await Promise.all([
        fetch("/api/profile", {
          method: "GET",
          cache: "no-store",
          headers
        }),
        fetch("/api/auth/me", {
          method: "GET",
          cache: "no-store",
          headers
        })
      ]);

      if (!profileResponse.ok) return;

      const profile = await profileResponse.json().catch(() => ({}));
      const me = meResponse.ok
        ? await meResponse.json().catch(() => ({}))
        : {};

      const user =
        me?.user ||
        me?.data?.user ||
        me?.data ||
        me ||
        {};

      const avatar =
        String(window.__milanPersistentAvatar || "").trim() ||
        String(profile?.avatar || "").trim() ||
        String(localStorage.getItem("milanAvatar") || "").trim();

      const did = String(
        user?.did ||
        profile?.did ||
        me?.did ||
        ""
      ).trim();

      if (avatar) {
        window.__milanPersistentAvatar = avatar;

        try {
          localStorage.setItem("milanAvatar", avatar);
        } catch {}

        document.querySelectorAll(
          "#myAvatar, #composerAvatar, .milan-identity-avatar"
        ).forEach(el => {
          const current =
            el.querySelector("img")?.getAttribute("src") || "";

          if (current !== avatar) {
            const img = document.createElement("img");
            img.src = avatar;
            img.alt = "Profile photo";
            img.loading = "eager";
            img.decoding = "async";
            el.replaceChildren(img);
            el.dataset.avatarSynced = "1";
          }
        });
      }

      if (did) {
        const didEl = document.getElementById("myDid");
        if (didEl && didEl.textContent.trim() !== did) {
          didEl.textContent = did;
        }

        document.querySelectorAll(
          ".milan-identity-cockpit .did-value, .milan-did-chip .value"
        ).forEach(el => {
          if (!el.textContent.trim() || /resolving/i.test(el.textContent)) {
            el.textContent = did;
          }
        });
      }

      document.querySelectorAll(
        ".milan-identity-status-chip.dwn .value, .milan-identity-cockpit .storage"
      ).forEach(el => {
        el.textContent = "Connected";
      });
    } catch (error) {
      console.warn(
        "[MILAN] persistent identity sync failed:",
        error?.message || error
      );
    } finally {
      syncing = false;
    }
  }

  window.__milanSyncPersistentIdentity = syncPersistentIdentity;

  setTimeout(syncPersistentIdentity, 1200);
  setInterval(syncPersistentIdentity, 15000);
})();
</script>

<script>
(() => {
  function bindSelectedFileName() {
    const input = document.getElementById("mediaFile");
    const name = document.getElementById("selectedFileName");
    if (!input || !name || input.dataset.filenameBound === "1") return;
    input.dataset.filenameBound = "1";

    function updateSelectedFile() {
      const file = input.files && input.files[0];
      name.replaceChildren();

      if (!file) {
        name.style.display = "none";
        name.removeAttribute("title");
        return;
      }

      const check = document.createElement("span");
      check.textContent = "✓";
      check.style.cssText = "color:#22c55e;font-size:18px;font-weight:900;flex-shrink:0;";

      const label = document.createElement("span");
      label.textContent = file.name;
      label.style.cssText = "margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;";

      const size = file.size < 1024
        ? file.size + " B"
        : file.size < 1024 * 1024
          ? Math.round(file.size / 1024) + " KB"
          : (file.size / (1024 * 1024)).toFixed(1) + " MB";

      name.append(check, label);
      name.title = [file.name, file.type || "Unknown file type", size].join(" • ");
      name.style.display = "inline-flex";
      name.style.alignItems = "center";
      name.style.maxWidth = "220px";
      name.style.minWidth = "0";
    }

    input.addEventListener("change", updateSelectedFile);
    updateSelectedFile();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindSelectedFileName, { once: true });
  } else {
    bindSelectedFileName();
  }
})();
</script>

<script id="milan-people-connect-js">
(function () {
  "use strict";

  var list = document.getElementById("peopleConnectList");
  if (!list) return;

  function jwtFrom(value) {
    if (typeof value === "string") {
      var text = value.trim().replace(/^Bearer\s+/i, "");
      if (/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(text)) return text;
      try { return jwtFrom(JSON.parse(value)); } catch (_) { return ""; }
    }
    if (value && typeof value === "object") {
      var keys = ["token", "accessToken", "access_token", "jwt", "idToken", "id_token"];
      for (var i = 0; i < keys.length; i++) {
        var found = jwtFrom(value[keys[i]]);
        if (found) return found;
      }
    }
    return "";
  }

  function authToken() {
    var direct = [window.milanToken, window.authToken, window.accessToken, window.token];
    for (var i = 0; i < direct.length; i++) {
      var fromWindow = jwtFrom(direct[i]);
      if (fromWindow) return fromWindow;
    }
    var stores = [window.localStorage, window.sessionStorage];
    for (var s = 0; s < stores.length; s++) {
      try {
        for (var j = 0; j < stores[s].length; j++) {
          var fromStore = jwtFrom(stores[s].getItem(stores[s].key(j)));
          if (fromStore) return fromStore;
        }
      } catch (_) {}
    }
    return "";
  }

  function headers(json) {
    var h = {};
    var token = authToken();
    if (token) h.Authorization = "Bearer " + token;
    if (json) h["Content-Type"] = "application/json";
    return h;
  }

  function initials(name) {
    return String(name || "M").trim().split(/\s+/).slice(0, 2)
      .map(function (word) { return word.charAt(0); }).join("").toUpperCase() || "M";
  }

  function shortDid(did) {
    did = String(did || "");
    return did.length > 22 ? did.slice(0, 12) + "…" + did.slice(-6) : did;
  }

  function buttonLabel(status) {
    if (status === "friends") return "Following";
    if (status === "sent") return "Requested";
    if (status === "received") return "Follow back";
    return "Follow";
  }

  function canFollow(status) {
    return status === "none" || status === "received";
  }

  function message(text) {
    list.className = "empty";
    list.textContent = text;
  }

  async function follow(person, button) {
    var original = button.textContent;
    button.disabled = true;
    button.textContent = "Sending…";

    try {
      var response = await fetch("/api/connections", {
        method: "POST",
        credentials: "same-origin",
        headers: headers(true),
        body: JSON.stringify({ toDid: person.did })
      });
      var data = await response.json().catch(function () { return {}; });
      if (!response.ok) throw new Error(data.error || "Could not follow this user.");

      person.connectionStatus = data.status === "accepted" ? "friends" : "sent";
      button.textContent = buttonLabel(person.connectionStatus);
      button.disabled = true;
    } catch (error) {
      button.textContent = original;
      button.disabled = false;
      alert(error.message || "Could not follow this user.");
    }
  }

  function render(people) {
    list.className = "milan-people-list";
    var fragment = document.createDocumentFragment();

    people.forEach(function (person) {
      var row = document.createElement("article");
      row.className = "milan-person";

      var avatar = document.createElement("div");
      avatar.className = "milan-person-avatar";
      var fallback = document.createElement("span");
      fallback.textContent = initials(person.name);
      avatar.appendChild(fallback);

      if (person.avatar) {
        var image = document.createElement("img");
        image.src = person.avatar;
        image.alt = (person.name || "User") + " profile photo";
        image.addEventListener("load", function () { fallback.hidden = true; });
        image.addEventListener("error", function () { image.remove(); fallback.hidden = false; });
        avatar.prepend(image);
      }

      var info = document.createElement("div");
      info.className = "milan-person-info";

      var name = document.createElement("span");
      name.className = "milan-person-name";
      name.textContent = person.name || "MILAN user";

      var did = document.createElement("span");
      did.className = "milan-person-did";
      did.title = person.did || "";
      did.textContent = "◈ " + shortDid(person.did);

      var button = document.createElement("button");
      button.type = "button";
      button.className = "milan-follow-btn";
      button.textContent = buttonLabel(person.connectionStatus);
      button.disabled = !canFollow(person.connectionStatus);
      if (!button.disabled) {
        button.addEventListener("click", function () { follow(person, button); });
      }

      info.appendChild(name);
      info.appendChild(did);
      row.appendChild(avatar);
      row.appendChild(info);
      row.appendChild(button);
      fragment.appendChild(row);
    });

    list.replaceChildren(fragment);
  }

  async function loadPeople() {
    message("Loading people…");
    try {
      var response = await fetch("/api/social/people", {
        credentials: "same-origin",
        cache: "no-store",
        headers: headers(false)
      });
      var people = await response.json().catch(function () { return null; });
      if (!response.ok) throw new Error((people && people.error) || "Could not load people.");
      if (!Array.isArray(people) || !people.length) {
        message("No other people to connect with yet.");
        return;
      }
      render(people);
    } catch (error) {
      message(error.message || "Could not load people.");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadPeople, { once: true });
  } else {
    loadPeople();
  }
})();
</script>

              <div class="mcc-list" id="mccRecords"></div>
            </article>

            <article class="mcc-card">
              <h3>📊 Account Activity</h3>
              <div class="mcc-list">
                <div class="mcc-row"><span>People</span><span id="mccPeopleCount">0</span></div>
                <div class="mcc-row"><span>Visible posts</span><span id="mccPostCount">0</span></div>
                <div class="mcc-row"><span>Requests</span><span id="mccRequestCount">0</span></div>
                <div class="mcc-row"><span>Unread alerts</span><span id="mccNotifCount">0</span></div>
              </div>
            </article>

            <article class="mcc-card">
              <h3>👤 Profile & Identity</h3>
              <div class="mcc-muted">Profile, DID and identity controls.</div>
              <div class="mcc-actions">
                <button class="primary" id="mccProfileBtn">Edit Profile</button>
                <button id="mccDidBtn">Copy DID</button>
              </div>
            </article>

          </div>
          <div id="mccResult"></div>
        </div>
      </section>
    `;

    document.body.appendChild(fab);
    document.body.appendChild(overlay);

    const close=()=>overlay.classList.remove("open");
    fab.onclick=()=>{overlay.classList.add("open");mccRefresh();};
    document.getElementById("milanControlClose").onclick=close;
    overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});

    document.getElementById("mccHealthBtn").onclick=checkHealth;
    document.getElementById("mccSyncBtn").onclick=syncView;
    document.getElementById("mccRefreshBtn").onclick=refreshEverything;

    document.getElementById("mccPrivacyBtn").onclick=()=>{
      close();
      if(typeof openPrivacyCenter==="function") openPrivacyCenter();
    };
    document.getElementById("mccSavedBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="saved"]');
      if(b)b.click();
    };
    document.getElementById("mccPeopleBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="friends"]');
      if(b)b.click();
      else if(typeof loadPeople==="function")loadPeople();
    };
    document.getElementById("mccRequestsBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="friends"]');
      if(b)b.click();
    };
    document.getElementById("mccMineBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="mine"]');
      if(b)b.click();
    };
    document.getElementById("mccAllBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="all"]');
      if(b)b.click();
    };
    document.getElementById("mccPublicBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="public"]');
      if(b)b.click();
    };
    document.getElementById("mccProfileBtn").onclick=()=>{
      close();
      if(typeof openProfile==="function")openProfile();
      else document.getElementById("profileBtn")?.click();
    };
    document.getElementById("mccDidBtn").onclick=()=>{
      if(typeof copyText==="function"){
        const did=document.getElementById("myDid")?.textContent||"";
        copyText(did);
        showResult("DID copied.");
      }
    };
  }

  async function checkHealth(){
    const dot=document.getElementById("mccHealthDot");
    const text=document.getElementById("mccHealthText");
    if(!dot||!text)return;
    text.textContent="Checking…";
    dot.className="mcc-dot warn";
    try{
      const r=await fetch("/api/health",{credentials:"same-origin",cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      const dwn=d.dwn||{};
      const good=d.ok!==false && dwn.ok!==false && dwn.storageOperational!==false;
      dot.className="mcc-dot "+(good?"":"bad");
      text.textContent=good
        ?"API + DWN healthy"
        :"Health response needs attention";
      showResult(
        "Health: "+(good?"OK":"Attention")+
        " · DWN: "+(dwn.ok===false?"problem":"ok")+
        " · Storage: "+(dwn.storageOperational===false?"problem":"ok")
      );
    }catch(e){
      dot.className="mcc-dot bad";
      text.textContent="Health check failed";
      showResult("Health check error: "+e.message);
    }
  }

  async function syncView(){
    const dot=document.getElementById("mccSyncDot");
    const text=document.getElementById("mccSyncText");
    if(!dot||!text)return;
    dot.className="mcc-dot warn";
    text.textContent="Refreshing…";
    try{
      const tasks=[];
      if(typeof loadFeed==="function")tasks.push(loadFeed());
      if(typeof loadSummary==="function")tasks.push(loadSummary());
      if(typeof loadPeople==="function")tasks.push(loadPeople());
      if(typeof loadNotifications==="function")tasks.push(loadNotifications());
      await Promise.allSettled(tasks);
      dot.className="mcc-dot";
      text.textContent="View refreshed";
      mccUpdate();
      showResult("Live feed, summary, people and notifications refreshed.");
    }catch(e){
      dot.className="mcc-dot bad";
      text.textContent="Refresh failed";
      showResult("Refresh error: "+e.message);
    }
  }

  async function refreshEverything(){
    await checkHealth();
    await syncView();
  }

  function mccUpdate(){
    const map=[
      ["peopleCount","mccPeopleCount"],
      ["postCount","mccPostCount"],
      ["requestCount","mccRequestCount"],
      ["notifCount","mccNotifCount"]
    ];
    map.forEach(([a,b])=>{
      const x=document.getElementById(a),y=document.getElementById(b);
      if(x&&y)y.textContent=x.textContent||"0";
    });

    const records=document.getElementById("mccRecords");
    if(records && Array.isArray(window.currentFeed)){
      const rows=window.currentFeed.slice(0,6);
      records.innerHTML=rows.length
        ?rows.map(r=>`
          <div class="mcc-row">
            <span>${escLocal(r.title||"Untitled record")}</span>
            <span>${escLocal(r.accessMode||"private")}</span>
          </div>
        `).join("")
        :'<div class="mcc-muted">No records loaded in the current feed.</div>';
    }
  }

  function showResult(msg){
    const box=document.getElementById("mccResult");
    if(!box)return;
    box.style.display="block";
    box.textContent=msg;
    clearTimeout(window.__mccResultTimer);
    window.__mccResultTimer=setTimeout(()=>box.style.display="none",5000);
  }

  function mccRefresh(){
    mccUpdate();
    checkHealth();
  }

  document.addEventListener("DOMContentLoaded",makeUI,{once:true});
  setTimeout(makeUI,1500);
  setInterval(()=>{if(document.getElementById("milanControlOverlay")?.classList.contains("open"))mccUpdate()},2000);
})();
</script>
